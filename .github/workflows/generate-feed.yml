name: Check RSS Feed

# feed.xml is generated from posts/posts.json and committed with it. Pushes to
# main go through pull requests, so a job cannot commit the feed afterwards;
# this check fails a pull request whose feed.xml is out of date instead.
# Regenerate with: node .github/scripts/generate-feed.js

on:
  pull_request:
    paths:
      - 'posts/**'
      - 'feed.xml'
      - '.github/scripts/generate-feed.js'
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'feed.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate feed.xml and compare
        run: |
          node .github/scripts/generate-feed.js
          if ! git diff --quiet -- feed.xml; then
            git --no-pager diff --stat -- feed.xml
            echo "::error file=feed.xml::feed.xml is out of date. Run node .github/scripts/generate-feed.js and commit the result."
            exit 1
          fi
          echo "feed.xml matches posts/posts.json."
